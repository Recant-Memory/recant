# Recant's default artifact (the tunable half of the machinery): working, host-neutral prompts and real model IDs.
# Seed a store with it through Machinery.seed_defaults(layout); copy it to change anything.
format: 3
version_note: 'Recant''s default machinery: host-neutral prompts, real models, reasoning off. Every value is yours to change.'
markers:
- name: rule_or_decision
  description: 'the principal settles how something is or will be: a rule, preference, boundary or decision about the system,
    the project or how the agent behaves from now on.'
- name: directive_to_act
  description: 'the principal tells the agent to go and do or find out something about its own work: investigate, verify,
    explain, stop, wait, report back, or proceed in a stated way. Most of what the principal sends is this, not a decision.
    A request for a product feature or a bug report about the product being built is NOT this: it is a task, and tasks are
    not marked.'
- name: root_cause
  description: A diagnosis or root cause is reached.
- name: failure_with_reason
  description: Something failed and the reason was established.
- name: reversal
  description: An earlier conclusion, plan, decision or claim is contradicted, reversed, abandoned or replaced by another
    — including a decision reversed later the same day (a morning 'keep the old UI' undone by an afternoon 'switch to the
    new one'). Includes 'originally X, switched to Y', an 'evolved decision', an approach dropped for one that worked, a
    version or model pinned and then re-pinned, and the agent having claimed something that turned out wrong. Put both the
    earlier and the later position inside the span when they are on the same or adjacent lines; when the reversal is a later
    line of the same file, mark the later line and quote it.
- name: manner_correction
  description: 'the principal tells the agent that the way it worked or communicated was wrong, and how to do it instead:
    too verbose, acted without asking, skipped a check, reported badly. Asking for a feature, reporting a bug, or giving
    a new task is NOT a correction of manner, however it is phrased.'
- name: non_compliance
  description: 'the agent does something other than comply immediately: it disagrees, declines, asks instead of assuming,
    or volunteers something unasked.'
- name: established_finding
  description: 'A fact is established by a tool or by reading a file, and a later task would otherwise have to look it up
    again: where something is configured or set, what a durable setting, endpoint, path, owner or schedule is, how a system
    is actually wired. It stays true until something changes it. Not a value true only that day (a version that day, a count,
    a status), and not the agent saying it is about to look.'
extractor:
  first_pass:
    model: claude-sonnet-5
    reasoning: 'off'
    prompt_version: e5
    prompt: |
      You are writing one memory for an AI agent from a marked moment in its working record. The record is
      the agent's own notes and the transcripts of its sessions with the person it works for, its principal. You are shown the moment, the lines around it, the markers that fired on it, and sometimes
      same-day lines from the other source.

      A memory is a single proposition that changes what the agent would do in a future situation. If the
      moment carries no such proposition, say so: verdict not_a_memory with the reason.
      - gauge_reading: a value that was true that day (a version, an image tag, a count, a status).
      - transient_metric: a number on its way somewhere (a test count climbing, a timing).
      - dead_pointer: a path, id or handle that will not be there later.
      - protocol_exhaust: heartbeats, acknowledgements, the agent narrating its next step.
      - task: work to do or done, a bug report, a feature request, an open item. Working state is not a memory.
      - restates: the same moment is stated more completely elsewhere in the lines shown.
      - no_proposition: nothing here changes a future decision.
      - own_tool_failure: the agent's own failed, refused or repeated tool calls, or how it misused a tool.

      Otherwise verdict memory, with exactly these fields.
      - claim: the proposition in one or two sentences, written to be read cold by someone with no context.
        State what was directed, decided, diagnosed or established. Never give the principal a reason, motive or
        judgement unless the lines quote them giving it. Never use "the principal said" phrasing: state the claim.
      - kind: stated (someone asserted it as a fact or preference), observed (something was seen to happen or
        was read off a tool), concluded (reasoned to from evidence), directive (someone told the agent how to
        act or what to do from now on).
      - actor_class and actor_id: who asserted it. principal means the principal themself: in a transcript, a line
        that is their own turn; in the daily notes, only a line that quotes them. A daily line that reports them without quoting them is the agent's report: actor_class agent, actor_id "agent". A directive from
        another agent instance or a system line is agent, with its name as the id.
      - quote, quote_start_line, quote_end_line: the anchor. Copy the quote character for character from
        the lines shown, from the episode above (never from the same-day lines), and give the line numbers
        it sits on. Do not paraphrase, join lines that are not adjacent, or repair text that is cut off.
      - channel: the channel the line names, if any ("chat", "cron"), else empty.
      - timestamp: a timestamp the line carries, else empty.
      - scope: the system, project or entity the claim binds to (a product, a service, a repo, "the agent itself", "how the agent works with the principal"). Not "general".
      - supersession_condition: what would make this claim stop being true, as a condition, never a date.
      - notes: at most two sentences of context a reader would need; empty if none.

      Rules. One moment, at most one memory: do not split it. The claim binds to its scope, not to the world.
      Do not store process ids, session ids, file paths that will move, or anything a heartbeat produced.
      If the moment contradicts an earlier position and both are in the lines shown, the claim is the later
      position and the notes name the earlier one.
      Absence is not negation: that the lines do not mention something is never a claim that it is false or
      was not done. An unresolved discrepancy stays unresolved in the claim ("the count is 26 by one source
      and 33 by another; unresolved"); never pick a side the lines do not settle.
      A directive that pins a version of something (a model, a template, a ruleset, an image) is a claim about
      that version: state the version and the date it was set, so a later pin can supersede it.
      A directive whose scope is one job — a named branch, PR, phase, lane, brief or item, a one-time gate or
      go-ahead — is task state, not a standing rule: verdict not_a_memory, reason task.
      A moment marked established_finding is a memory when the fact stays true until something changes it
      (where a value is set, what a durable setting or owner is, how a system is wired): kind observed, the
      claim names where it was established (the file or the tool), and supersession_condition names what
      would change it. It is gauge_reading only when the value was true that day alone.
      The agent's own tool failures and retries are not memories: a call that errored, was refused or was
      repeated, a note that the agent misused a tool, or the agent's own account of such a failure in a reply or a
      ledger note ("I called the tool without …", "the same mistake again"), is verdict not_a_memory, reason
      own_tool_failure.
      A fact about the environment that a failure revealed (a path that does not exist, a service that is down
      by design, a limit of the machine) is a memory: state the fact, not the failure.
  steady_state:
    model: claude-sonnet-5
    reasoning: 'off'
    prompt_version: e5
    prompt: |
      You are writing one memory for an AI agent from a marked moment in its working record. The record is
      the agent's own notes and the transcripts of its sessions with the person it works for, its principal. You are shown the moment, the lines around it, the markers that fired on it, and sometimes
      same-day lines from the other source.

